<af-form ctrl="afform">
  <af-entity data="{source: 'SumUp Donation'}" type="Individual" name="Individual1" label="Individual 1" actions="{create: true, update: false}" security="FBAC" contact-dedupe="Individual.Supervised" />
  <af-entity data="{contact_id: 'Individual1', financial_type_id: 1}" type="Contribution" name="Contribution1" label="Contribution 1" actions="{create: true, update: false}" security="FBAC" />

  <div class="crm-sumup-bento-layout af-container">

    <!-- LEFT COLUMN: Donor details + amount + submit -->
    <div class="crm-sumup-bento-col crm-sumup-bento-col--form af-container">

      <fieldset af-fieldset="Individual1" class="af-container crm-sumup-bento-panel" af-title="Vos coordonnées">
        <div actions="{update: true, delete: true}" class="af-container">
          <af-field name="first_name" />
          <af-field name="last_name" />
          <div af-join="Email" actions="{update: true, delete: true}" data="{is_primary: true}">
            <af-field name="email" />
          </div>
        </div>
      </fieldset>

      <fieldset af-fieldset="Contribution1" class="af-container crm-sumup-bento-panel crm-sumup-amount-panel" af-title="Votre don">
        <af-field name="default_contribution_amount.contribution_amount" defn="{label: 'Montant', input_attrs: {}, required: true}" />
        <crm-tax-reduction />
      </fieldset>

      <button class="af-button btn btn-primary crm-sumup-continue-btn" crm-icon="fa-lock"
        ng-click="afform.submit()"
        ng-if="afform.showSubmitButton">
        Continuer vers le paiement
      </button>

    </div>

    <!-- RIGHT COLUMN: Order summary + payment orchestrator -->
    <div class="crm-sumup-bento-col crm-sumup-bento-col--payment af-container">

      <!-- Order summary card (always visible) -->
      <crm-checkout-summary></crm-checkout-summary>

      <!--
        Payment orchestrator.
        options = comma-separated checkout_option keys to offer.
        Add or remove keys to configure available payment methods.
        Example: options="sumup_embedded_checkout_SumUP,pay_later"
      -->
      <crm-payment-orchestrator entity-name="Contribution1"
        direct-mount="true"
        options="sumup_embedded_checkout_SumUP">
        <fieldset af-fieldset="Contribution1" class="crm-sumup-payment-fieldset">
          <af-field name="checkout_params" defn="{label: false}" />
        </fieldset>
      </crm-payment-orchestrator>

    </div>

  </div>

</af-form>
