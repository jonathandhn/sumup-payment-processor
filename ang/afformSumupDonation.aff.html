<af-form ctrl="afform">
  <af-entity data="{source: 'SumUp Donation'}" type="Individual" name="Individual1" label="Individual 1" actions="{create: true, update: false}" security="FBAC" contact-dedupe="Individual.Supervised" />
  <af-entity data="{contact_id: 'Individual1', checkout_option: 'sumup_embedded', financial_type_id: 1}" type="Contribution" name="Contribution1" label="Contribution 1" actions="{create: true, update: false}" security="FBAC" />

  <div class="crm-sumup-bento-layout">

    <!-- LEFT COLUMN: Donor details + amount + submit -->
    <div class="crm-sumup-bento-col crm-sumup-bento-col--form">

      <fieldset af-fieldset="Individual1" class="af-container crm-sumup-bento-panel" af-title="Vos coordonnees">
        <div actions="{update: true, delete: true}" class="af-container">
          <af-field name="first_name" />
          <af-field name="last_name" />
          <div af-join="Email" actions="{update: true, delete: true}" data="{is_primary: true}">
            <af-field name="email" />
          </div>
        </div>
      </fieldset>

      <fieldset af-fieldset="Contribution1" class="af-container crm-sumup-bento-panel crm-sumup-amount-panel" af-title="Votre don">
        <af-field name="default_contribution_amount.contribution_amount" defn="{label: 'Montant', input_attrs: {}, required: true}" />
        <crm-tax-reduction />
      </fieldset>

      <button class="af-button btn btn-primary crm-sumup-continue-btn" crm-icon="fa-lock" ng-click="afform.submit()" ng-if="afform.showSubmitButton">
        Continuer vers le paiement
      </button>

    </div>

    <!-- RIGHT COLUMN: payment orchestrator (summary + method selector + widgets) -->
    <div class="crm-sumup-bento-col crm-sumup-bento-col--payment">

      <crm-payment-orchestrator entity-name="Contribution1">

        <!-- Order summary — always visible, reads live form data -->
        <crm-checkout-summary></crm-checkout-summary>

        <!-- Method: card payment via SumUp -->
        <crm-payment-method key="card" label="Carte bancaire" icon="fa-credit-card">
          <fieldset af-fieldset="Contribution1" class="crm-sumup-payment-fieldset">
            <af-field name="checkout_params" defn="{label: false}" />
          </fieldset>
        </crm-payment-method>

        <!-- Method: offline / bank transfer
             set-data merges into Contribution entity before submit:
               payment_processor_id=null → no SumUp checkout created
               is_pay_later=1           → Pending contribution
               payment_instrument_id=5  → EFT / bank transfer instrument
        -->
        <crm-payment-method key="transfer" label="Virement bancaire" icon="fa-university"
          set-data="{payment_processor_id: null, is_pay_later: 1, payment_instrument_id: 5}">
          <crm-offline-payment></crm-offline-payment>
        </crm-payment-method>

      </crm-payment-orchestrator>

    </div>

  </div>

</af-form>
