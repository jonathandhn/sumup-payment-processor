<div class="crm-sumup-embedded-checkout__error messages error" ng-if="$ctrl.error">
  <span>{{$ctrl.error}}</span>
  <button type="button" class="crm-sumup-btn-modify" ng-click="$ctrl.cancelAndUnlock()" style="margin-left: 0.75rem;">
    <i class="crm-i fa-arrow-left"></i> {{ts('Go back / Edit')}}
  </button>
</div>

<!-- Inline Payment Section (100% on Page 1) -->
<div class="crm-sumup-inline-checkout" ng-show="$ctrl.active">
  <div class="crm-sumup-accordion-success" ng-show="$ctrl.completed">
    <div class="crm-sumup-accordion-success__icon">
      <i class="crm-i fa-check-circle"></i>
    </div>
    <h3>{{ts('Payment Confirmed!')}}</h3>
    <p>{{ts('Thank you! Your payment has been approved and recorded successfully.')}}</p>
    <div class="crm-sumup-accordion-summary__badge">
      <span>{{$ctrl.amount}} {{$ctrl.currency}}</span>
    </div>
  </div>

  <div ng-hide="$ctrl.completed">
    <div class="crm-sumup-accordion-item crm-sumup-accordion-item--active">
      <div class="crm-sumup-accordion-header">
        <div class="crm-sumup-accordion-header__left">
          <span class="crm-sumup-step-badge crm-sumup-step-badge--active"><i class="crm-i fa-credit-card"></i></span>
          <div class="crm-sumup-step-info">
            <span class="crm-sumup-step-title">{{ts('Choose a payment method')}}</span>
          </div>
        </div>
        <div class="crm-sumup-accordion-header__right">
          <span class="crm-sumup-total-amount">{{$ctrl.amount}} {{$ctrl.currency}}</span>
        </div>
      </div>

      <div class="crm-sumup-accordion-body">
        <div class="crm-sumup-payment-frame">
          <div class="crm-sumup-embedded-checkout" id="sumup-afform-mount-target"></div>
        </div>
      </div>
    </div>

    <div class="crm-sumup-actions" style="margin-top: 0.75rem; justify-content: center;">
      <button type="button" class="crm-sumup-btn-modify" ng-click="$ctrl.cancelAndUnlock()">
        <i class="crm-i fa-arrow-left"></i> {{ts('Edit details')}}
      </button>
    </div>
  </div>
</div>
