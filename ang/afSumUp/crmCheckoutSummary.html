<div class="crm-checkout-summary">
  <div class="crm-checkout-summary__header">
    <i class="crm-i fa-list-alt" aria-hidden="true"></i>
    <span>{{ts('Order summary')}}</span>
  </div>

  <div class="crm-checkout-summary__lines">
    <div class="crm-checkout-summary__line" ng-repeat="item in $ctrl.lineItems track by $index">
      <span class="crm-checkout-summary__line-label">{{item.label}}</span>
      <span class="crm-checkout-summary__line-amount">{{item.formatted}}</span>
    </div>
    <div class="crm-checkout-summary__line crm-checkout-summary__line--empty" ng-if="!$ctrl.lineItems.length">
      <span class="crm-checkout-summary__line-label crm-checkout-summary__line-label--pending">—</span>
      <span class="crm-checkout-summary__line-amount crm-checkout-summary__line-amount--pending">—</span>
    </div>
  </div>

  <div class="crm-checkout-summary__divider"></div>

  <div class="crm-checkout-summary__total">
    <strong class="crm-checkout-summary__total-label">{{ts('Total')}}</strong>
    <strong class="crm-checkout-summary__total-amount" ng-if="$ctrl.hasTotal">
      {{$ctrl.formattedTotal}}
    </strong>
    <strong class="crm-checkout-summary__total-amount crm-checkout-summary__total-amount--pending" ng-if="!$ctrl.hasTotal">
      —
    </strong>
  </div>

  <div class="crm-checkout-summary__actions" ng-if="$ctrl.isActive()">
    <button type="button" class="crm-sumup-btn-modify crm-checkout-summary__edit-btn" ng-click="$ctrl.edit()">
      <i class="crm-i fa-pencil" aria-hidden="true"></i> {{ts('Edit')}}
    </button>
  </div>
</div>
